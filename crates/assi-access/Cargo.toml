[package]
name = "assi-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
