<script>
'use strict';
const $=s=>document.querySelector(s);
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devices=[
 {id:'mac',name:'MacBook Pro',os:'macOS',place:'Личный',code:'482 916 305',online:true,star:true,icon:'laptop'},
 {id:'office',name:'Компьютер в офисе',os:'Windows',place:'Работа',code:'731 408 562',online:true,star:true,icon:'monitor'},
 {id:'pixel',name:'Pixel 9',os:'Android',place:'Личный',code:'265 813 047',online:false,star:true,icon:'phone'},
 {id:'linux',name:'Рабочая станция',os:'Linux',place:'Работа',code:'928 415 603',online:true,star:false,icon:'monitor'}
];
const state={page:'connect',filter:'all',query:'',mobile:new URLSearchParams(location.search).has('mobile')};
let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function card(d){return `<article class="device"><div class="device-top"><span class="device-icon">${icon(d.icon)}</span><button class="star" aria-label="${d.star?'Убрать из избранного':'Добавить в избранное'}: ${d.name}" aria-pressed="${d.star}" data-star="${d.id}">${icon('star')}</button></div><h3>${d.name}</h3><p>${d.os} <span style="padding:0 4px">·</span> ${d.place}</p><div class="device-bottom"><span class="status ${d.online?'':'offline'}"><span class="dot"></span>${d.online?'В сети':'Не в сети'}</span><button class="icon-button" data-device="${d.id}" aria-label="${d.online?'Подключиться к':'Посмотреть'} ${d.name}">${icon('arrow')}</button></div></article>`}
function footer(){return `<div class="footer-note"><span>${icon('shield')}Доступ всегда под вашим контролем</span><span>Windows · macOS · Linux · Android</span></div>`}
function intro(title,subtitle){return `<div class="page-intro"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="intro-symbol">${icon('link')}</div></div>`}
function render(){
 document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const title={connect:'Подключение',devices:'Устройства',history:'История'}[state.page];
 $('#breadcrumb').innerHTML=`Личное пространство <span style="padding:0 12px;color:var(--faint)">/</span> ${title}`;
 if(state.page==='connect'){
  $('#content').innerHTML=intro('Ближе к вашим устройствам.','Работайте удалённо. Помогайте тем, кто рядом.')+`<div class="connect-grid"><section class="panel primary"><div class="panel-head">${icon('arrow')}<h2>Подключиться</h2></div><p>Введите код устройства, которым хотите управлять.</p><form id="connect-form" novalidate><label class="field-label" for="remote-code">Код удалённого устройства</label><div class="input-wrap"><input id="remote-code" name="code" inputmode="numeric" autocomplete="off" placeholder="000 000 000" maxlength="11" aria-describedby="code-error"></div><p class="error" id="code-error" role="alert"></p><button class="btn white wide" type="submit">Подключиться ${icon('arrow')}</button></form><div class="helper">${icon('lock')}Подключение после подтверждения владельцем</div></section><section class="panel"><div class="panel-head">${icon('monitor')}<h2>Разрешить подключение</h2></div><p>Передайте свой код человеку, которому доверяете.</p><span class="field-label">Ваш демо-код</span><div class="own-id"><strong>584 209 176</strong><button class="icon-button" id="copy-id" aria-label="Скопировать демо-код">${icon('copy')}</button></div><button class="btn wide" id="invite">Приглашение на сеанс ${icon('link')}</button><div class="helper">${icon('shield')}Вы выбираете, кто получит доступ</div></section></div><div class="section-heading"><h2>Всегда под рукой</h2><button class="text-button" data-page="devices">Все устройства ${icon('arrow')}</button></div><div class="device-grid" id="device-grid">${devices.filter(d=>d.star).map(card).join('')||'<div class="empty">Добавьте устройства в избранное</div>'}</div>`+footer();
  $('#connect-form').addEventListener('submit',e=>{e.preventDefault();const digits=$('#remote-code').value.replace(/\D/g,'');if(digits.length!==9){$('#code-error').textContent='Введите 9 цифр кода устройства.';$('#remote-code').setAttribute('aria-invalid','true');$('#remote-code').focus();return}if(digits==='584209176'){$('#code-error').textContent='Это ваш код. Введите код другого устройства.';$('#remote-code').setAttribute('aria-invalid','true');return}showConnect(digits.match(/.{1,3}/g).join(' '),'Удалённое устройство')});
  $('#remote-code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,9).replace(/(\d{3})(?=\d)/g,'$1 ');$('#code-error').textContent='';e.target.removeAttribute('aria-invalid')});
  $('#copy-id').onclick=()=>copy('584 209 176');$('#invite').onclick=showInvite;
 }else if(state.page==='devices'){
  $('#content').innerHTML=intro('Ваши устройства.','Всё, к чему вы подключаетесь, в одном месте.')+`<div class="toolbar"><label class="search">${icon('search')}<input id="device-search" type="search" aria-label="Поиск устройств" placeholder="Название, система или пространство" value="${escapeHtml(state.query)}"></label><div class="filters" aria-label="Фильтр устройств"><button class="filter" data-filter="all" aria-pressed="${state.filter==='all'}">Все</button><button class="filter" data-filter="online" aria-pressed="${state.filter==='online'}">В сети</button><button class="filter" data-filter="star" aria-pressed="${state.filter==='star'}">Избранное</button></div></div><div class="device-grid" id="device-grid"></div>`+footer();
  renderDevices();$('#device-search').oninput=e=>{state.query=e.target.value;renderDevices()};
 }else{
  $('#content').innerHTML=intro('История подключений.','Легко вернуться к тому, с кем работали недавно.')+`<div class="section-heading"><h2>Пример журнала сеансов</h2><small>Демоданные</small></div><div class="history-row"><div><p>Компьютер в офисе</p><small>Windows · Управление с подтверждением</small></div><span class="history-time">Сегодня, 10:42<br><small>24 минуты</small></span><span class="status">Завершён</span></div><div class="history-row"><div><p>MacBook Pro</p><small>macOS · Просмотр экрана</small></div><span class="history-time">Вчера, 18:15<br><small>12 минут</small></span><span class="status">Завершён</span></div><div class="history-row"><div><p>Рабочая станция</p><small>Linux · Управление с подтверждением</small></div><span class="history-time">Вчера, 14:03<br><small>38 минут</small></span><span class="status">Завершён</span></div>`+footer();
 }
}
function renderDevices(){const q=state.query.trim().toLocaleLowerCase('ru');const list=devices.filter(d=>(state.filter!=='online'||d.online)&&(state.filter!=='star'||d.star)&&`${d.name} ${d.os} ${d.place}`.toLocaleLowerCase('ru').includes(q));$('#device-grid').innerHTML=list.map(card).join('')||'<div class="empty"><h3>Устройства не найдены</h3><p>Измените запрос или выберите другой фильтр.</p></div>'}
function modal(title,body,actions){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-actions').replaceChildren();actions.forEach(a=>{const b=document.createElement('button');b.className=`btn ${a.primary?'white':''}`;b.textContent=a.label;b.onclick=a.run;$('#dialog-actions').append(b)});if(!$('#dialog').open)$('#dialog').showModal();else $('#dialog-close').focus()}
function showConnect(code,name){modal('Запрос на подключение',`<h3>${escapeHtml(name)}</h3><p>Код ${escapeHtml(code)}</p><div class="permission">${icon('shield')}<div>Нужно подтверждение владельца<small>В реальном приложении он увидит ваше имя и запрашиваемые разрешения.</small></div></div><p>Это демонстрация сценария. Запрос на другое устройство не отправляется.</p>`,[{label:'Отмена',run:()=>$('#dialog').close()},{label:'Показать следующий шаг',primary:true,run:()=>showSession(name)}])}
function showSession(name){modal('Предпросмотр сеанса',`<h3>${escapeHtml(name)}</h3><p>Здесь появится удалённый экран после подтверждения подключения.</p><ul class="session-list"><li>${icon('monitor')}Просмотр экрана</li><li>${icon('cursor')}Управление по разрешению владельца</li><li>${icon('lock')}Передача файлов с отдельным разрешением</li></ul><div class="permission">${icon('link')}<div>Макет интерфейса<small>Экран и управление в этой версии не передаются.</small></div></div>`,[{label:'Завершить демосеанс',primary:true,run:()=>{$('#dialog').close();toast('Демосеанс завершён')}}])}
function showInvite(){modal('Приглашение на сеанс',`<h3>Помощь начинается с кода.</h3><p>В будущем приложении приглашение будет действовать ограниченное время.</p><p class="code">584 209 176</p><p>Демо-код · не открывает доступ к компьютеру</p><div class="permission">${icon('shield')}<div>Вы подтверждаете каждое подключение<small>И можете завершить сеанс в любой момент.</small></div></div>`,[{label:'Закрыть',run:()=>$('#dialog').close()},{label:'Скопировать демо-код',primary:true,run:()=>copy('584 209 176')}])}
async function copy(value){try{await navigator.clipboard.writeText(value);toast('Демо-код скопирован')}catch{toast('Не удалось скопировать. Код: '+value)}}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;render();return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));renderDevices();return}const star=e.target.closest('[data-star]');if(star){const d=devices.find(d=>d.id===star.dataset.star);d.star=!d.star;if(state.page==='devices')renderDevices();else render();toast(d.star?'Добавлено в избранное':'Убрано из избранного');return}const dev=e.target.closest('[data-device]');if(dev){const d=devices.find(d=>d.id===dev.dataset.device);if(d.online)showConnect(d.code,d.name);else modal('Устройство не в сети',`<h3>${d.name}</h3><p>Откройте Асси на устройстве и проверьте подключение к интернету. После этого оно появится в сети.</p><div class="permission">${icon('phone')}<div>Помощь Android<small>Для показа экрана потребуется системное подтверждение на телефоне.</small></div></div>`,[{label:'Понятно',primary:true,run:()=>$('#dialog').close()}])}});
$('#dialog-close').onclick=()=>$('#dialog').close();
$('#theme-toggle').onclick=()=>{document.body.classList.toggle('light');$('#theme-toggle').setAttribute('aria-label',document.body.classList.contains('light')?'Включить тёмную тему':'Включить светлую тему')};
function applyViewport(){$('#frame').classList.toggle('mobile',state.mobile);$('#viewport-toggle').textContent=state.mobile?'Десктопный вид':'Мобильный вид'}
$('#viewport-toggle').onclick=()=>{state.mobile=!state.mobile;applyViewport()};
applyViewport();render();
</script>
</body>
</html>
